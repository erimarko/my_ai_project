[project]
name = "my-ai-roject"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "ipykernel>=7.4.0",
    "jupyterlab>=4.6.4",
    "langchain>=1.4.4",
    "langchain-openai>=1.7.1",
    "langsmith>=0.14.7",
    "notebook>=7.6.3",
    "openai>=3.29.0",
    "python-dotenv>=1.2.4",
]

[project.scripts]
my-ai-roject = "my_ai_roject:main"

[build-system]
requires = ["uv_build>=0.12.22,<0.13.0"]
build-backend = "uv_build"
